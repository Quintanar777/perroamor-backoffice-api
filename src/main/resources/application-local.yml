spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: inventory
    password: inventory
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

logging:
  level:
    com.perroamor: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
