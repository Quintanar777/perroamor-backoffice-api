spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: inventory
    password: inventory
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  jwt:
    secret: dev-only-secret-replace-in-prod-256-bits-minimum-this-string-is-padded-on-purpose-do-not-use-in-prod
    access-ttl-minutes: 15
    refresh-ttl-days: 7

logging:
  level:
    com.perroamor: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
